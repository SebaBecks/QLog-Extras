name: macOS 13 Intel test build

# Test DMG for Intel Macs from macOS 13 Ventura. Libraries are built from
# source because Homebrew bottles on the runner require macOS 15.
on:
  workflow_dispatch:
  push:
    branches:
      - macos-test

env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  QT_VERSION: "6.8.3"
  OPENSSL_VERSION: "3.0.22"
  HAMLIB_VERSION: "4.7.2"
  QTKEYCHAIN_VERSION: "0.15.0"
  LIBUSB_VERSION: "1.0.29"
  RTLSDR_VERSION: "v2.0.2"

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  macos-intel:
    name: macOS 13 Intel DMG
    runs-on: macos-15-intel

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: mac
        target: desktop
        arch: clang_64
        modules: qtcharts qtwebengine qtwebchannel qtpositioning qtserialport qtwebsockets qtmultimedia
        cache: true

    - name: Prepare
      run: |
        echo "DEPS=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/deps/lib/pkgconfig" >> "$GITHUB_ENV"
        command -v pkg-config || brew install pkgconf
        cmake --version | head -1

    - name: Cache libraries
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.DEPS }}
        key: macos13-intel-${{ env.QT_VERSION }}-${{ env.OPENSSL_VERSION }}-${{ env.HAMLIB_VERSION }}-${{ env.QTKEYCHAIN_VERSION }}-${{ env.LIBUSB_VERSION }}-${{ env.RTLSDR_VERSION }}

    - name: Build OpenSSL
      if: steps.deps.outputs.cache-hit != 'true'
      working-directory: ${{ runner.temp }}
      run: |
        curl -sSL "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz" | tar xz
        cd "openssl-$OPENSSL_VERSION"
        ./Configure darwin64-x86_64-cc shared no-tests --prefix="$DEPS" --libdir=lib
        make -j4
        make install_sw

    - name: Build Hamlib
      if: steps.deps.outputs.cache-hit != 'true'
      working-directory: ${{ runner.temp }}
      run: |
        curl -sSL "https://github.com/Hamlib/Hamlib/releases/download/$HAMLIB_VERSION/hamlib-$HAMLIB_VERSION.tar.gz" | tar xz
        cd "hamlib-$HAMLIB_VERSION"
        ./configure --prefix="$DEPS" --disable-static --without-readline --without-libusb --without-cxx-binding
        make -j4
        make install

    - name: Build QtKeychain
      if: steps.deps.outputs.cache-hit != 'true'
      working-directory: ${{ runner.temp }}
      run: |
        git clone --depth 1 --branch "$QTKEYCHAIN_VERSION" https://github.com/frankosterfeld/qtkeychain.git
        cmake -S qtkeychain -B qtkeychain/build -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_WITH_QT6=ON -DBUILD_TRANSLATIONS=OFF -DBUILD_TEST_APPLICATION=OFF \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_INSTALL_PREFIX="$DEPS" \
          -DCMAKE_INSTALL_NAME_DIR="$DEPS/lib" -DCMAKE_OSX_ARCHITECTURES=x86_64 \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build qtkeychain/build --parallel 4
        cmake --install qtkeychain/build

    - name: Build librtlsdr
      if: steps.deps.outputs.cache-hit != 'true'
      working-directory: ${{ runner.temp }}
      run: |
        curl -sSL "https://github.com/libusb/libusb/releases/download/v$LIBUSB_VERSION/libusb-$LIBUSB_VERSION.tar.bz2" | tar xj
        (cd "libusb-$LIBUSB_VERSION" && ./configure --prefix="$DEPS" --disable-static && make -j4 && make install)
        git clone --depth 1 --branch "$RTLSDR_VERSION" https://github.com/osmocom/rtl-sdr.git
        cmake -S rtl-sdr -B rtl-sdr/build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$DEPS" -DCMAKE_INSTALL_NAME_DIR="$DEPS/lib" \
          -DCMAKE_PREFIX_PATH="$DEPS" -DCMAKE_OSX_ARCHITECTURES=x86_64 \
          -DINSTALL_UDEV_RULES=OFF -DDETACH_KERNEL_DRIVER=OFF \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build rtl-sdr/build --parallel 4
        cmake --install rtl-sdr/build
        ls -l "$DEPS/lib"

    - name: Save libraries
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.DEPS }}
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build QLog
      run: |
        mkdir qlog-build
        cd qlog-build
        qmake -config release ../QLog.pro \
          QMAKE_MACOSX_DEPLOYMENT_TARGET=13.0 QMAKE_APPLE_DEVICE_ARCHS=x86_64 \
          "INCLUDEPATH+=$DEPS/include" "LIBS+=-L$DEPS/lib" \
          HAMLIBVERSION_MAJOR=4 HAMLIBVERSION_MINOR=7 HAMLIBVERSION_PATCH=2
        make -j4

    - name: Bundle
      working-directory: qlog-build
      run: |
        macdeployqt qlog.app -executable=./qlog.app/Contents/MacOS/qlog -verbose=1
        # librtlsdr is loaded at runtime, so macdeployqt does not see it
        FW=qlog.app/Contents/Frameworks
        cp -L "$DEPS/lib/libusb-1.0.0.dylib" "$DEPS/lib/librtlsdr.0.dylib" "$FW/"
        chmod u+w "$FW/libusb-1.0.0.dylib" "$FW/librtlsdr.0.dylib"
        install_name_tool -id @executable_path/../Frameworks/libusb-1.0.0.dylib "$FW/libusb-1.0.0.dylib"
        install_name_tool -id @executable_path/../Frameworks/librtlsdr.0.dylib "$FW/librtlsdr.0.dylib"
        install_name_tool -change "$DEPS/lib/libusb-1.0.0.dylib" @loader_path/libusb-1.0.0.dylib "$FW/librtlsdr.0.dylib"
        codesign --force --deep -s - qlog.app

    - name: Check minimum macOS and library paths
      working-directory: qlog-build
      run: |
        bad=0
        while IFS= read -r f; do
          # Qt binaries are universal; only the Intel slice matters here
          file -b "$f" | grep -q "Mach-O" || continue
          minos=$(otool -arch x86_64 -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{v=1} v&&/version/{print $2; exit}')
          major=${minos%%.*}
          if [ -n "$major" ] && [ "$major" -gt 13 ]; then
            echo "::error::$f requires macOS $minos"
            bad=1
          fi
          if otool -arch x86_64 -L "$f" | tail -n +2 | grep -E "/usr/local/|/opt/homebrew/|$RUNNER_TEMP|/Users/runner/"; then
            echo "::error::$f links outside the bundle"
            bad=1
          fi
        done < <(find qlog.app -type f)
        otool -L qlog.app/Contents/MacOS/qlog
        exit $bad

    - name: Build DMG
      working-directory: qlog-build
      run: |
        hdiutil create -volname QLog -srcfolder qlog.app -ov -format UDZO QLog-Extras-macos13-intel-test.dmg

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: QLog-Extras-macos13-intel-test
        path: qlog-build/QLog-Extras-macos13-intel-test.dmg
